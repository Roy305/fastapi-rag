<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>ドキュメントQ&Aシステム</title>

    <style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #0f0f0f;
    color: #e0e0e0;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
    min-height: 100vh;
  }

  h1 {
    font-size: 2rem;
    letter-spacing: 0.1em;
    margin-bottom: 60px;
    color: #ffffff;
  }

  h2 {
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 12px;
  }

  .section {
    width: 100%;
    max-width: 640px;
    margin-bottom: 40px;
  }

  input[type="file"],
  input[type="text"] {
    width: 100%;
    background: #1a1a1a;
    border: 1px solid #333;
    color: #e0e0e0;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 0.95rem;
    margin-bottom: 12px;
    outline: none;
  }

  input[type="text"]:focus {
    border-color: #555;
  }

  button {
    width: 100%;
    background: #ffffff;
    color: #0f0f0f;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: background 0.2s;
  }

  button:hover {
    background: #cccccc;
  }

  #answerArea {
    width: 100%;
    max-width: 640px;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 20px;
    font-size: 0.95rem;
    line-height: 1.7;
    min-height: 80px;
    color: #e0e0e0;
  }
</style>

</head>

<body>
    <h1>Document Q&A</h1>

<div class="section">
  <h2>Upload</h2>
  <input type="file" id="fileInput">
  <button id="uploadButton">アップロード</button>
</div>

<div class="section">
  <h2>Question</h2>
  <input type="text" id="questionInput" placeholder="質問を入力してください">
  <button id="askButton">送信</button>
</div>

<div class="section">
  <h2>Answer</h2>
  <div id="answerArea"></div>
</div>

<script>
    document.getElementById("uploadButton").addEventListener("click", async ()=>{
        
        const file = document.getElementById("fileInput").files[0];

        if (!file) {
  alert("ファイルを選択してください");
  return;
}
        const formData = new FormData();
        formData.append("file",file);

        const response = await fetch("/upload",{
            method:"POST",
            body: formData
        });
        const data = await response.json();
        alert(data.message);
    });


    document.getElementById("askButton").addEventListener("click",async()=>{
        const question = document.getElementById("questionInput").value;

        if (!question) {
  alert("質問を入力してください");
  return;
}

        const response = await fetch("/rag",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({message:question})
        });
        const data = await response.json();
        document.getElementById("answerArea").innerText = data.reply;
    });
</script>

</body>
</html>
