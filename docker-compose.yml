version: '3.8'

services:
 
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://my_user:my_password@db:5432/my_blog_db
    depends_on:
      - db

  
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: my_user        
      POSTGRES_PASSWORD: my_password  
      POSTGRES_DB: my_log_db       
    ports:
      - "5432:5432"